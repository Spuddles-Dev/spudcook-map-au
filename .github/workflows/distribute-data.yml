name: Validate and publish public data

on:
  push:
    branches: [main]
    paths: ['distribution/candidate-release.json', 'distribution/*.zip', 'schema/**', 'tools/**', '.github/workflows/distribute-data.yml']
  pull_request:
    paths: ['distribution/**', 'schema/**', 'tools/**', '.github/workflows/distribute-data.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools/tests -v
      - name: Validate candidate ZIPs and typed pages
        run: python tools/validate_distribution.py

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Publish complete release before advancing current pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_distribution.py
